<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qohesion</title>
<meta name="description" content="Qohesion, un outil libre de vote et de décision pour les organisations dirigées par leurs membres. Free, self-hosted voting and decision tool for member-run organizations.">
<meta name="theme-color" content="#0F224C">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Outfit";src:url(outfit-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}
html{background:#0F224C;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;background:#0F224C;color:#EAF2FF;font-family:Outfit,system-ui,sans-serif;line-height:1.45}
main{display:grid;grid-template-columns:minmax(0,1fr);place-content:center;justify-items:center;gap:clamp(20px,4vh,36px);padding:48px 24px 24px;text-align:center}
.mark{width:clamp(200px,44vw,340px);height:auto;display:block;margin:-6% 0;-webkit-mask-image:radial-gradient(closest-side,#000 92%,transparent 100%);mask-image:radial-gradient(closest-side,#000 92%,transparent 100%)}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:500;letter-spacing:-.01em;line-height:1}
.line{display:grid;gap:6px;text-wrap:balance;font-size:clamp(1.05rem,2.6vw,1.3rem)}
.line span:first-child{font-weight:500}
.line span:last-child{color:#A9BEE6}
footer{padding:20px 24px 28px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-size:.9rem;color:#A9BEE6}
a{color:#EAF2FF;text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:3px solid #47EBA0;outline-offset:3px;border-radius:2px}
::selection{background:#47EBA0;color:#0F224C}
@media (prefers-reduced-motion:no-preference){.mark{animation:rise .7s cubic-bezier(.16,1,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<main>
<picture><source srcset="logo-560.webp" type="image/webp"><img class="mark" src="logo-560.jpg" width="560" height="560" alt="Logo Qohesion"></picture>
<h1>Qohesion</h1>
<p class="line"><span>Bientôt disponible. Décidons ensemble.</span><span lang="en">Coming soon. Decide together.</span></p>
</main>
<footer>
<a href="https://github.com/msolav/qohesion">Code source <span lang="en">· Source code</span></a>
<span>Logiciel libre <span lang="en">· Free software</span> · AGPL-3.0</span>
</footer>
</body>
</html>
