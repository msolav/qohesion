<title>Qohesion</title>
<meta name="description" content="Qohesion is open-source software for holding votes and polls in groups such as associations, unions and councils. The software is under development.">
<meta name="theme-color" content="#0F224C">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">

<style>
@font-face{font-family:"Outfit";src:url(../outfit-latin.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}
html{background:#0F224C;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;background:#0F224C;color:#EAF2FF;font-family:Outfit,system-ui,sans-serif;line-height:1.45}
main{display:grid;grid-template-columns:minmax(0,1fr);place-content:center;justify-items:center;gap:clamp(20px,4vh,36px);padding:48px 24px 24px;text-align:center}
.lockup{display:block;width:min(88vw,780px);height:auto;margin:0 auto}
h1{line-height:0;font-size:0}
.line{display:grid;gap:6px;text-wrap:balance;font-size:clamp(1.05rem,2.6vw,1.3rem)}
.tagline{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;letter-spacing:-.01em;line-height:1.15}
.line{max-width:36rem;font-weight:500;color:#C9D8F2}
.soon{font-size:.95rem;color:#A9BEE6;letter-spacing:.02em}
footer{padding:20px 24px 28px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-size:.9rem;color:#A9BEE6}
a{color:#EAF2FF;text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:3px solid #47EBA0;outline-offset:3px;border-radius:2px}

.lang{position:absolute;top:16px;right:16px;display:flex;border:1.5px solid #A9BEE6;border-radius:99px;overflow:hidden;font-size:.85rem;font-weight:700}
.lang a{display:grid;place-items:center;min-width:2.9rem;min-height:2.75rem;color:#EAF2FF;text-decoration:none}
.lang a:hover:not([aria-current]){background:#17306A}
.lang a[aria-current]{background:#EAF2FF;color:#0F224C}
.lang a:focus-visible{outline-offset:-3px}
::selection{background:#47EBA0;color:#0F224C}
@media (prefers-reduced-motion:no-preference){.lockup{animation:rise .7s cubic-bezier(.16,1,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
}
</style>
</head>
