name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  email:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/email/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  roll:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/roll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/roll/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ledger/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg QOHESION_COMMIT=${{ github.sha }} -t qohesion:ci .
      - name: Start it and check the version endpoint
        run: |
          docker run -d --name q -p 3000:3000 -e ORIGIN=http://localhost:3000 --read-only --cap-drop ALL qohesion:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/version && break || sleep 1; done
          curl -fsS http://localhost:3000/version | grep -q "\"version\":\"$(cat VERSION)\""
          curl -fsS http://localhost:3000/version | grep -q "${GITHUB_SHA:0:7}"

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version is declared once and used consistently
        run: node scripts/check-version.mjs
      - name: Licences are declared for every file (REUSE)
        uses: fsfe/reuse-action@v5
